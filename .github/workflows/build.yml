name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug + release
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Lint
        if: ${{ always() }}
        run: ./gradlew --no-daemon lintDebug

      - name: Collect build reports
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          cp -r app/build/reports/lint-results-debug.html artifacts/ 2>/dev/null || true
          cp -r app/build/reports/tests/testDebugUnitTest artifacts/unit-tests 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Island-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk artifacts/Island-release.apk 2>/dev/null || true
          ls -la artifacts/

      - name: Upload APKs and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: island-apks
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
