name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare log directory
        shell: bash
        run: mkdir -p ci-logs artifacts

      - name: Assemble debug + release
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee ci-logs/assemble.log

      - name: Unit tests
        shell: bash
        if: ${{ always() }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee ci-logs/unit-tests.log

      - name: Lint
        shell: bash
        if: ${{ always() }}
        run: ./gradlew --no-daemon lintDebug 2>&1 | tee ci-logs/lint.log

      - name: Collect build outputs
        shell: bash
        if: ${{ always() }}
        run: |
          cp app/build/outputs/apk/debug/*.apk artifacts/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk artifacts/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.html ci-logs/ 2>/dev/null || true
          ls -la artifacts/ ci-logs/ || true

      - name: Upload APKs and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: island-apks
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      # The sandbox that drives this repo cannot reach the Actions artifact/log CDN (only
      # github.com and git transport are reachable), so a successful run publishes the APKs back to
      # the branch where they can be fetched with a plain `git pull`. [skip ci] prevents a loop.
      - name: Publish APKs
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "island-ci"
          git config user.email "ci@island.local"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/island-release.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk dist/island-debug.apk 2>/dev/null || true
          # A debug APK carries every Compose icon unshaken; skip it if it would bloat the repo.
          if [ -f dist/island-debug.apk ] && [ "$(stat -c%s dist/island-debug.apk)" -gt 26214400 ]; then
            echo "debug APK is $(stat -c%s dist/island-debug.apk) bytes — not committing it"
            rm -f dist/island-debug.apk
          fi
          {
            echo "built from ${GITHUB_SHA}"
            echo "gradle: $(./gradlew --version 2>/dev/null | awk -F': ' '/^Gradle /{print $2; exit}')"
            echo
            ls -la dist
          } > dist/BUILD-INFO.txt
          git add -f dist
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish APKs for ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}" || echo "apk push failed"
          else
            echo "no APK changes to publish"
          fi

      # The sandbox that drives this repo cannot reach the Actions log CDN, so a failing run
      # publishes its logs back to the branch. [skip ci] prevents a workflow loop.
      - name: Publish failure logs
        if: ${{ failure() }}
        shell: bash
        run: |
          git config user.name "island-ci"
          git config user.email "ci@island.local"
          git add -f ci-logs
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish build logs for ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}" || echo "log push failed"
          else
            echo "no log changes to publish"
          fi
