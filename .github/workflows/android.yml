name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/check-secrets.py
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew :core:test :testDebugUnitTest :lintDebug :app:lintDebug :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest :benchmark:assembleBenchmark --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-and-unsigned-apk
          path: |
            **/build/reports/
            app/build/outputs/apk/release/*.apk

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --max-workers=2
            adb pull /sdcard/Android/data/com.dynamicisland.host/files/screenshots app/build/device-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
            app/build/device-screenshots/
