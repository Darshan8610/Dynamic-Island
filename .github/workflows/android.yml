name: Android checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Check credential patterns
        run: python3 tools/check-secrets.py
      - name: Test, lint and build development-signed release
        run: ./gradlew :core:test :testDebugUnitTest :lintDebug :app:lintDebug :app:assembleRelease :app:bundleRelease -PislandDevelopmentSigning=true --stacktrace --max-workers=2
      - name: Verify APK signature, alignment and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-2.0.1-development-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            build/reports
            build/test-results
            core/build/reports
            core/build/test-results
            app/build/reports
          if-no-files-found: warn

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation and release installation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest :app:assembleRelease -PislandDevelopmentSigning=true --stacktrace --max-workers=2
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.dynamicisland.host
            adb logcat -c
            adb shell am start -W -n com.dynamicisland.host/.MainActivity
            adb shell pidof com.dynamicisland.host
            adb logcat -d -s AndroidRuntime:E > release-logcat.txt
            ! rg 'FATAL EXCEPTION' release-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api35
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            release-logcat.txt
          if-no-files-found: warn
