name: Android checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Secret Patterns
        run: python3 tools/check-secrets.py

      - name: Run Tests and Build Release APK
        run: ./gradlew :core:test :testDebugUnitTest :lintDebug :app:lintDebug :app:assembleRelease :app:bundleRelease --stacktrace --max-workers=2

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Dynamic Island v2.0 - 120Hz Fluid Motion & Notch Elevation"
          body: |
            ### Dynamic Island v2.0 Release
            - **120Hz Fluid Motion Engine**: Replaced IPC-per-tick WindowManager layout bottlenecks with unified hardware-synced spring transforms.
            - **Luminous Music Timeline**: Multi-tier radial neon bloom and dynamic trailing comet gradient.
            - **iOS Tri-State Privacy Dots**: iOS color-accurate Orange (`#FF9F0A` - Mic), Green (`#30D158` - Camera), and Blue (`#0A84FF` - Both).
            - **Camera Notch Elevation**: Added `TYPE_ACCESSIBILITY_OVERLAY` support to render above system status bar icons and provide responsive touch inside the camera cutout.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Emulator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :core:test :testDebugUnitTest --max-workers=2